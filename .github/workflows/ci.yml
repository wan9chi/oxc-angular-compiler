name: CI

# Replay: CI keeps only the E2E job, whose `Compare tests` step runs `vp run compare` with remote
# caching. Runs aren't cancelled by newer pushes, so every replayed event finishes.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  napi:
    name: NAPI Build (Ubuntu E2E)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Remote cache uploads authenticate with a GitHub Actions OIDC token.
      id-token: write
    env:
      # Remote task cache, on when the repository variable is set. Pushes and pull requests from
      # this repository upload results; fork pull requests get no OIDC token and only download.
      # Replay: pull requests from fork/ branches stand in for fork pull requests.
      VP_REMOTE_CACHE_URL: ${{ vars.VP_REMOTE_CACHE_URL }}
      VP_REMOTE_CACHE: ${{ !vars.VP_REMOTE_CACHE_URL && 'off' || (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository && !startsWith(github.head_ref, 'fork/')) && 'read-write' || 'read' }}
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - name: Update submodules
        run: git submodule update --init --recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@fb003b4f771bbf9c2de31d5f65c40689cc097fb5 # v2.1.0

      - name: Install pnpm
        uses: pnpm/action-setup@08c4be7e2e672a47d11bd04269e27e5f3e8529cb # v6.0.0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: |
          pnpm build-dev
          pnpm --filter ./napi/angular-compiler build:ts

      - name: Lint
        run: pnpm check

      - name: Test
        run: |
          pnpm --filter ./napi/angular-compiler exec playwright install --with-deps
          pnpm test:e2e
      # `vp run compare` runs the harness's `compare --fixtures` in two tasks: the cached ngtsc
      # baseline, then the comparison with Oxc (see vite.config.ts).
      - name: Compare tests
        run: pnpm exec vp run compare
        env:
          # Replay diagnostics: vp's debug traces show where each task's time goes, such as how long
          # its remote cache lookup waited. VP_* envs aren't fingerprinted.
          VP_LOG: vt=debug,vt_remote_cache=debug
      # Replay diagnostics: the full summary of the compare run, with each task's cache status.
      - if: ${{ !cancelled() }}
        run: pnpm exec vp run --last-details
      # Replay check: keep the baseline the cached run left, to compare with a fresh one at the end.
      - if: ${{ !cancelled() }}
        continue-on-error: true
        run: node .github/replay/baseline.mjs snapshot napi/angular-compiler/e2e/compare/ng-baseline-fixtures.json "${{ runner.temp }}/cached-baseline.json"
      # Replay check: generate the baseline again without the cache, and compare it with the one the
      # cached run left. A difference after a hit is a false hit unless ngtsc's output is
      # nondeterministic. These steps don't affect the job's result.
      - if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          VP_REMOTE_CACHE: 'off'
        run: |
          rm -f napi/angular-compiler/e2e/compare/ng-baseline-fixtures.json
          pnpm exec vp run --no-cache ng-baseline
      - if: ${{ !cancelled() }}
        continue-on-error: true
        run: node .github/replay/baseline.mjs compare "${{ runner.temp }}/cached-baseline.json" napi/angular-compiler/e2e/compare/ng-baseline-fixtures.json "${{ runner.temp }}/replay-diff"
      - if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: replay-diff
          path: ${{ runner.temp }}/replay-diff
          if-no-files-found: ignore
          retention-days: 30
